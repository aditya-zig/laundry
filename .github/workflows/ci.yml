name: Wandary checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wandary
          POSTGRES_PASSWORD: wandary_dev_only
          POSTGRES_DB: wandary
        ports:
          - 5448:5432
        options: >-
          --health-cmd "pg_isready -U wandary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wandary:wandary_dev_only@localhost:5448/wandary
      DEMO_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm check:convex
      - run: pnpm test
      - run: pnpm test:voice
  deploy-convex:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/wandary'
    runs-on: ubuntu-latest
    concurrency:
      group: laundry-production-backend
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec convex deploy --typecheck enable
