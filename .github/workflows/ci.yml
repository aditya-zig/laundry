name: Laundry checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: laundry_dev_only
          POSTGRES_DB: laundry_verify_ci
        ports:
          - 5448:5432
        options: >-
          --health-cmd "pg_isready -U laundry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://laundry:laundry_dev_only@localhost:5448/laundry_verify_ci
      DEMO_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm check:convex
      - run: pnpm contracts:check
      - run: pnpm test:tooling
      - run: pnpm test
      - run: pnpm test:voice
      - run: pnpm verify:container
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:browser
      - run: pnpm verify:restore
      - run: pnpm verify:recording
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-acceptance-${{ github.sha }}
          path: .verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
# No branch push deploys a product backend. Production promotion is a separate,
# explicitly gated release action; the historical Convex adapter is not the
# canonical PostgreSQL product backend.
