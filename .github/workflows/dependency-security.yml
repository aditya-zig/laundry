name: Dependency security gate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Preserve the audit's actual nonzero exit. Do not turn an unpatched
      # advisory into a passing release check or silently accept it.
      - run: |
          mkdir -p .verification
          pnpm release:security --json > .verification/dependency-audit.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: .verification/dependency-audit.log
          if-no-files-found: error
          retention-days: 14
