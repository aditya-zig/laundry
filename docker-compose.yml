services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wandary
      # Development-only password. Production uses separate credentials.
      POSTGRES_PASSWORD: wandary_dev_only
      POSTGRES_DB: wandary
    ports:
      - "5448:5432"
    volumes:
      - wandary-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"

volumes:
  wandary-pgdata:
